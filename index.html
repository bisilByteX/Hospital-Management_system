<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- Navbar -->

    <nav>

        <div class="logo">
            <i class="fa-solid fa-hospital"></i>
            <span>Hospital Management System</span>
        </div>

        <ul>

            <li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>

            <li><a href="#form"><i class="fa-solid fa-user-plus"></i> Admit Patient</a></li>

        </ul>

    </nav>

    <!-- Hero -->

    <section class="hero">

        <div class="left">

            <h1>Welcome to Hospital Management System</h1>

            <p>
                Manage patient admissions quickly and efficiently.
            </p>

        </div>

        <!-- <div class="right">

            <img src="https://cdn-icons-png.flaticon.com/512/2967/2967350.png">

        </div> -->

    </section>

    <!-- Form -->

    <section id="form" class="card">

        <h2>
            <i class="fa-solid fa-user-plus"></i>
            Admit Patient
        </h2>

        <form id="patientForm">

            <div class="row">

                <div class="inputBox">

                    <label>Patient Name</label>

                    <input type="text" id="name"
                        placeholder="Enter patient name" required>

                </div>

                <div class="inputBox">

                    <label>Age</label>

                    <input type="number" id="age"
                        placeholder="Enter age" required>

                </div>

            </div>

            <div class="row">

                <div class="inputBox">

                    <label>Gender</label>

                    <select id="gender">

                        <option>Select Gender</option>

                        <option>Male</option>

                        <option>Female</option>

                        <option>Other</option>

                    </select>

                </div>

                <div class="inputBox">

                    <label>Date of Birth</label>

                    <input type="date" id="dob">

                </div>

            </div>

            <div class="row">

                <div class="inputBox">

                    <label>Phone Number</label>

                    <input type="tel" id="phone"
                        placeholder="Enter phone number">

                </div>

                <div class="inputBox">

                    <label>Illness / Disease</label>

                    <input type="text" id="disease"
                        placeholder="Enter illness">

                </div>

            </div>

            <div class="inputBox">

                <label>Address</label>

                <textarea id="address"
                    placeholder="Enter Address"></textarea>

            </div>

            <button>

                <i class="fa-solid fa-user-plus"></i>

                Admit Patient

            </button>

        </form>

    </section>

    <script src="script.js"></script>

</body>

</html>
